# Gradle
# trustStoreType=WINDOWS-ROOT：沙箱网络有 HTTPS 中间人证书，Java 默认信任库不认，用 Windows 系统信任库解决
# 页面文件(C盘虚拟内存)紧张，Gradle 守护进程内存降低，避免 commit_memory 失败(1455)
org.gradle.jvmargs=-Xmx1536m -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.parallel=true
# 国内网络下 mojang 源较慢，加大 HTTP 超时
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000

# Fabric
minecraft_version=1.21
loader_version=0.15.11
fabric_version=0.102.0+1.21

# Mod
mod_version=1.0.0
maven_group=com.materialstock
archives_base_name=materialstock
